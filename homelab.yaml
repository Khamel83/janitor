schema: homelab.project/v1
project:
  id: janitor
  name: Janitor
  repository: https://github.com/Khamel83/janitor
  kind: service
  lifecycle: active
  owner: homelab
monitoring:
  state: observing
runtime:
  production:
    host: homelab
    managed_by: systemd
    unit: janitor-sweep.timer
health:
  source: homelab-api
  checks: []
observability:
  event_sink: homelab-api:/observations
  evidence_policy: sanitized
dependencies:
  required: []
  optional:
    - gateway2000
secrets:
  broker_consumer: janitor
  references: []
operations:
  repair_ids: []
docs:
  index: README.md
  spec: docs/superpowers/specs/2026-09-07-janitor-repository-caretaker-design.md
